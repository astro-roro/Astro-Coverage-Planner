version: 2
updates:
  # Python dependencies: requirements.txt and packaging/constraints.txt. One
  # entry covers both folders, so a bump of one package is one PR touching
  # both files. Runs monthly. Two grouped PRs per run: minor + patch updates
  # together (auto-merged when Tests pass), and all major updates together
  # (never auto-merged, the owner reviews it). The group names are used by
  # .github/workflows/dependabot-auto-merge.yml, so keep them in step.
  # Security updates ignore the schedule and group rules above (they are
  # raised as soon as an advisory appears); they arrive as their own PRs.
  - package-ecosystem: pip
    directories:
      - /
      - /packaging
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      pip-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: "deps"
      include: scope

  # GitHub Actions versions referenced in workflow files. Monthly, same two
  # groups: minor + patch bundled and auto-merged, majors bundled and left
  # for the owner.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: "ci"
      include: scope
