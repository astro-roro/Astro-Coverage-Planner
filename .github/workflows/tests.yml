name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}  # so publish.yml can gate on this passing

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit dependencies for known vulnerabilities
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

      - name: Run tests
        env:
          # Point the extension auto-loader at an empty dir so the
          # maintainer's local private extensions don't interfere
          # with the in-tree test suite.
          ACP_EXTENSIONS_DIR: /tmp/acp-no-extensions
        run: |
          mkdir -p /tmp/acp-no-extensions
          python -m unittest discover -s tests -v

  tests-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run frontend tests
        # Node's built-in test runner — no npm install, no node_modules.
        # See tests/frontend/ and static/search.mjs.
        run: node --test tests/frontend/
