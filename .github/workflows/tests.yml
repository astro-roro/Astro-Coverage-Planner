name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}  # so publish.yml can gate on this passing

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Audit dependencies for known vulnerabilities
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt requirements-packaged.txt

      - name: Run tests
        env:
          # Point the extension auto-loader at an empty dir so the
          # maintainer's local private extensions don't interfere
          # with the in-tree test suite.
          ACP_EXTENSIONS_DIR: /tmp/acp-no-extensions
          # The bundled sync extension has its own tests (tests/ts_sync);
          # keep it out of every test that imports app.
          ACP_DISABLE_BUNDLED_EXTENSIONS: "1"
        run: |
          mkdir -p /tmp/acp-no-extensions
          python -m pytest tests -v

  # Most ACP users run it on Windows next to NINA, while the maintainer and
  # the job above run on macOS and Linux. Issue #46 was a Windows-only
  # difference in how Python labels static files, so run the suite there too.
  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          ACP_EXTENSIONS_DIR: ${{ runner.temp }}\acp-no-extensions
          ACP_DISABLE_BUNDLED_EXTENSIONS: "1"
        run: |
          New-Item -ItemType Directory -Force -Path "$env:ACP_EXTENSIONS_DIR" | Out-Null
          python -m pytest tests -v

  tests-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run frontend tests
        # Node's built-in test runner — no npm install, no node_modules.
        # See tests/frontend/ and static/search.mjs.
        run: node --test tests/frontend/
