<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Astro Coverage — {{ total_targets }} targets, {{ total_hours }}h</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">
      <strong>Astro Coverage Planner</strong>
      <span class="meta">{{ total_targets }} targets · {{ total_hours }}h · scan {{ scan_date }}</span>
    </div>

    <div class="controls">
      <label class="ctrl">Projection:
        <select id="projSel">
          <option value="AIT">Aitoff (all-sky)</option>
          <option value="SIN">Orthographic</option>
          <option value="MOL">Mollweide</option>
          <option value="TAN">Gnomonic (zoomed)</option>
        </select>
      </label>
      <label class="ctrl">Frame:
        <select id="frameSel">
          <option value="equatorial">Equatorial (ICRS)</option>
          <option value="galactic">Galactic</option>
        </select>
      </label>
      <label class="ctrl">Site:
        <select id="siteSel">
          <option value="sydney" data-lat="-33.87" data-lon="151.21" data-height="20">Sydney (-33.87, 151.21)</option>
          <option value="victoria" data-lat="-37.50" data-lon="145.00" data-height="700">Victoria obs. (-37.50, 145.00)</option>
          <option value="custom" data-lat="" data-lon="">Custom…</option>
        </select>
        <input type="number" id="latIn"  step="0.01" placeholder="lat"  style="display:none;width:75px" />
        <input type="number" id="lonIn"  step="0.01" placeholder="lon"  style="display:none;width:75px" />
      </label>
    </div>

    <div class="filters">
      <span class="label">Filters:</span>
      <label class="fchip"><input type="checkbox" data-f="Ha"   checked /> Ha</label>
      <label class="fchip"><input type="checkbox" data-f="SII"  checked /> SII</label>
      <label class="fchip"><input type="checkbox" data-f="OIII" checked /> OIII</label>
      <label class="fchip"><input type="checkbox" data-f="L"    /> L</label>
      <label class="fchip"><input type="checkbox" data-f="R"    /> R</label>
      <label class="fchip"><input type="checkbox" data-f="G"    /> G</label>
      <label class="fchip"><input type="checkbox" data-f="B"    /> B</label>
      <label class="fchip"><input type="checkbox" data-f="V"    /> V</label>
      <span class="label">Logic:</span>
      <select id="filterLogic">
        <option value="any">ANY selected filter</option>
        <option value="all">ALL selected filters</option>
        <option value="ha_not_sii">Have Ha but NOT SII</option>
      </select>
      <span class="label">Min hours/filter:</span>
      <input type="range" id="depthSlider" min="0" max="10" step="0.5" value="0" />
      <span id="depthValue">0h</span>
    </div>

    <div class="telescopes">
      <span class="label">Telescopes:</span>
      <div id="telescopeChips" class="tele-chips"></div>
    </div>

    <div class="catalogs">
      <span class="label">Catalogues:</span>
      <label class="fchip"><input type="checkbox" id="cat_green" /> Green SNRs</label>
      <label class="fchip"><input type="checkbox" id="cat_smgps" /> SMGPS cand.</label>
      <label class="fchip"><input type="checkbox" id="cat_emu" /> EMU cand.</label>
      <label class="fchip"><input type="checkbox" id="cat_hii" /> WISE HII</label>
      <button id="gapMode">Gap mode: Ha ∧ ¬SII</button>
      <button id="exportCsv">Export priority CSV</button>
    </div>
  </header>

  <main class="layout">
    <div id="aladin-lite-div"></div>

    <aside id="sidePanel" class="panel">
      <div class="panel-loading">Loading targets…</div>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="tooltip"></span>
    <span id="obsNow"></span>
  </footer>

  <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
