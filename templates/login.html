<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Astro Coverage Planner</title>
<!-- Everything is inline. The gate covers /static too, so this page has to
     render before anyone has a credential. -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0d1117; color: #c9d1d9;
         font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { width: min(24rem, calc(100vw - 3rem)); }
  h1 { font-size: 1.25rem; margin: 0 0 0.25rem; color: #e6edf3; }
  p { margin: 0 0 1.5rem; color: #8b949e; font-size: 0.9rem; }
  label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #8b949e; }
  input { width: 100%; box-sizing: border-box; padding: 0.6rem 0.7rem;
          border: 1px solid #30363d; border-radius: 6px;
          background: #010409; color: #e6edf3; font-size: 1rem; }
  input:focus { outline: 2px solid #1f6feb; outline-offset: -1px; border-color: #1f6feb; }
  button { width: 100%; margin-top: 0.9rem; padding: 0.6rem;
           border: 0; border-radius: 6px; background: #238636; color: #fff;
           font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  button:hover { background: #2ea043; }
  .error { margin: 0 0 1rem; padding: 0.6rem 0.7rem; border-radius: 6px;
           background: #3d1418; border: 1px solid #6e2429; color: #ffa198;
           font-size: 0.88rem; }
</style>
</head>
<body>
<main>
  <h1>Astro Coverage Planner</h1>
  <p>This instance is protected by an access token. Paste the value of
     <code>ACP_API_TOKEN</code> to continue.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next_path }}">
    <label for="token">Access token</label>
    <input id="token" name="token" type="password" autocomplete="current-password"
           autofocus required>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
